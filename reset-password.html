<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval'; connect-src *;">
    <title>Red product</title>
    <link rel="stylesheet" href="style2.css">
    <link rel="icon" type="image/svg+xml" href="images/Link → SVG .png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div class="container1 relative bg-[url(/images/back.png)] w-full h-[100vh]">
        <div class="container2 absolute inset-0 bg-black/75"></div>
        <div class="formulaire flex flex-col justify-center items-center min-h-[100vh]">
            <div class="titre relative z-10 flex items-center gap-3 pb-6">
                <i class="fa-regular fa-bookmark fa-xl" style="color: white;"></i>
                <h2 class="titre2 text-white font-bold text-l">RED PRODUCT</h2>
            </div>
            <form id="reset-form">
                <div class="relative bg-white px-4 py-5 rounded">
                    <p class="text-l pb-2 font-semibold">Nouveau mot de passe</p>
                    <p class="text-sm text-gray-500 mb-4">Entrez votre nouveau mot de passe ci-dessous.</p>
                    <div class="inp flex flex-col">
                        <input id="new-password" class="border-b border-b-gray-300 pt-[15px] pb-3 outline-none" type="password" placeholder="Nouveau mot de passe">
                        <input id="confirm-password" class="border-b border-b-gray-300 pt-[15px] pb-3 outline-none" type="password" placeholder="Confirmer mot de passe">
                    </div>
                    <div class="bg-[#45484B] text-white text-center py-1 w-full mt-7 rounded">
                        <button type="submit">Réinitialiser</button>
                    </div>
                </div>
            </form>
            <p class="text-white relative text-sm pt-3">
                <span class="text-[#FFD964] font-semibold"><a href="connexion.html">Retour à la connexion</a></span>
            </p>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="toast.js"></script>
    <script src="reset.js"></script>
</body>
</html>
