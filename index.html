<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Product</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="icon" type="image/svg+xml" href="images/Link → SVG .png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=browse" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <div class="flex">
        <!-- MENU TOGGLE -->
        <label class="md:hidden relative inset-0 z-[9999]" id="menu-label">
            <div class="toggle">
                <span class="top-line common"></span>
                <span class="middle-line common"></span>
                <span class="bottom-line common"></span>
            </div>
        </label>

        <div class="slide hidden fixed top-0 left-0 w-[80%] h-full z-[9998] back ">
            <div class=" w-full z-10 bg-black/75 h-full ">
                <div class="go">
                    <div class=" flex items-center gap-3 px-5 pb-2 mb-4 pt-12">
                        <i class="fa-chisel fa-regular fa-bookmark fa-xl" style="color: white;"></i>
                        <h2 class=" titre2 text-white font-bold text-l">RED PRODUCT</h2>
                    </div>
                    <ul>
                        <li class="text-white relative px-5 py-1 mb-4 text-sm">Principal</li>
                        <div class="text-white relative flex items-center gap-3 px-5 py-2 mb-4 w-full">
                            <span class="material-symbols-outlined">browse</span>
                            <li class="text-sm"><a href="index2.html">Dashboard</a></li>
                        </div>
                        <div class="text-white relative flex items-center gap-3 mx-auto px-5 py-2 mb-4 bg-white">
                            <i class="fa-solid fa-display text-black"></i>
                            <li class="text-sm text-black"><a href="index.html">Listes des hôtels</a></li>
                        </div>
                    </ul>
                </div>
            </div>
        </div>
        <!-- SIDEBAR -->
        <aside class="w-64 fixed top-0 left-0 h-screen hidden md:block z-[999] overflow-y-auto">
            <div class="relative w-full h-full back">
                <div class="absolute inset-0 bg-black/75"></div>
                <div class="relative z-10">
                    <div class="titre flex items-center gap-3 px-5 pb-2 mb-2 pt-5">
                        <i class="fa-chisel fa-regular fa-bookmark fa-xl" style="color: white;"></i>
                        <h2 class=" titre2 text-white font-bold text-l">RED PRODUCT</h2>
                    </div>
                    <p class="text-white px-5 py-1 mb-2 text-sm">Principal</p>
                    <div class="text-white flex items-center gap-3 px-5 py-2 ">
                        <span class="material-symbols-outlined">browse</span>
                        <p class="text-sm "><a href="index2.html">Dashboard</a></p>
                    </div>
                    <div class="text-white flex items-center gap-3 px-5 py-2 bg-white w-full mb-2">
                        <i class="fa-solid fa-display text-black"></i>
                        <p class="text-sm text-black"><a href="index.html">Listes des hôtels</a></p>
                    </div>
                </div>
                <!-- STATUT EN LIGNE -->
                <div class="absolute bottom-0 w-full p-4 border-t border-white/20 z-10">
                    <div class="flex items-center gap-3">
                        <img class="border rounded-[50%] w-[40px] h-[40px] object-cover" src="images/homme.png" alt="">
                        <div>
                            <p id="nom-user" class="text-white text-sm font-semibold"></p>
                            <p class="text-white/60 text-xs"> <span class="w-0 h-0">🟢</span>En ligne</p>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <div class="flex-1 ml-0 md:ml-64 pt-32 md:pt-32 overflow-y-auto">
            <!-- HEADER -->

            <header class="fixed shadow-lg top-0 right-0 left-0 md:left-64 z-[990] bg-white border-b border-gray-100">
                <div class="w-full px-4 md:px-12 py-3">
                    <div class="flex flex-row justify-between items-center gap-4">
                        <h2 class="text-lg md:text-xl font-semibold text-gray-800 truncate flex-shrink ml-10 md:ml-0">
                            Liste des hôtels
                        </h2>
                        <div class="flex items-center gap-3 md:gap-6 flex-shrink-0">
                            <div class="hidden sm:block relative">
                                <input
                                    class="border border-gray-300 rounded-full py-1.5 px-4 pr-10 outline-none text-sm focus:border-blue-400 focus:ring-1 focus:ring-blue-100 transition-all w-40 md:w-64"
                                    type="text" placeholder="Rechercher...">
                                <i
                                    class="fa-solid fa-magnifying-glass absolute right-3.5 top-2.5 text-gray-400 text-xs"></i>
                            </div>
                            <div class="relative cursor-pointer hover:text-blue-600 transition-colors">
                                <i class="fa-regular fa-bell text-gray-600 text-lg" id="cloche"
                                    onclick="toggleNotifications()"></i>
                                <span id="notif-count"
                                    class="absolute -top-1 -right-1.5 bg-red-500 text-white text-[10px] rounded-full w-4 h-4 flex items-center justify-center hidden">0</span>

                                <!-- Dropdown notifications -->
                                <div id="notif-dropdown"
                                    class="hidden absolute right-0 top-8 w-72 bg-white shadow-xl rounded-xl z-[9999] border border-gray-100">
                                    <div class="flex justify-between items-center px-4 py-3 border-b">
                                        <h3 class="font-semibold text-sm">Notifications</h3>
                                        <button onclick="toggleNotifications()" class="text-gray-400 text-xs">✕</button>
                                    </div>
                                    <div id="notif-list" class="max-h-64 overflow-y-auto">
                                        <p class="text-gray-400 text-sm text-center p-4">Aucune notification</p>
                                    </div>
                                </div>
                            </div>
                            <div class="w-9 h-9 md:w-11 md:h-11 flex-shrink-0">
                                <a href="profile.html">
                                    <img id="profil-img"
                                        class="rounded-full w-full h-full object-cover border-2 border-gray-200 shadow-inner cursor-pointer hover:opacity-80 transition"
                                        src="images/homme.png" alt="Profil">
                                </a>
                            </div>
                            <a href="connexion.html" class="text-gray-500 hover:text-red-500 transition-colors p-1"
                                title="Se déconnecter">
                                <i class="fa-solid fa-arrow-right-from-bracket text-lg"></i>
                            </a>
                        </div>
                    </div>
                </div>

                <div class="flex justify-between items-center px-4 md:px-12 py-3 bg-gray-50 border-t border-gray-100">
                    <h3 class="text-2xl md:text-3xl font-extralight text-gray-700 tracking-tight">Hôtels</h3>
                    <button
                        class="modal-btn modal-trigger bg-white border border-gray-300 hover:bg-gray-100 hover:border-gray-400 transition-all rounded-lg px-4 py-2 shadow-sm text-sm font-medium flex items-center gap-2 text-gray-700">
                        <span class="hidden sm:inline">+ Créer un nouveau hôtel</span>
                        <span class="sm:hidden font-bold">+ Nouveau</span>
                    </button>
                </div>
            </header>
            <!-- Liste des hôtels -->
            <main class="min-h-screen p-4 md:p-8">
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 hotel-list">
                </div>
            </main>

        </div>
    </div>
    <!-- POPPOSES -->
    <div class="fixed inset-0 bg-black/50 hidden modal-overlay z-[9998] transition-opacity">
        <div
            class="md:mb-18 w-[95%] md:w-[70%] lg:w-[40%] p-4 md:p-6 mx-auto fixed top-2 left-0 right-0 bg-white border-2 modal-container overflow-y-auto max-h-[95vh] rounded-lg shadow-2xl">
            <div class="flex text-gray-500 justify-center items-center mx-auto gap-2 mb-4">
                <i class="fa-solid fa-arrow-left close-modal text-xl cursor-pointer hover:scale-110 transition-transform"
                    style="color: black;"></i>
                <h1 class="uppercase text-sm md:text-l font-bold text-gray-600">CRÉER UN NOUVEAU HÔTEL</h1>
            </div>
            <hr class="border border-dashed border-gray-400 mb-5">
            <form id="hotel-form" class="w-full">
                <div class="flex flex-col md:flex-row gap-4 justify-center w-full items-center p-2">
                    <div class="flex flex-col w-full md:w-[50%]">
                        <label class="pb-2 text-sm font-semibold" for="nom">Nom de l'hôtel</label>
                        <input id="nom" type="text" placeholder="Ex: CAP Mariane" required
                            class="outline-none border border-gray-400 p-[8px] rounded-xl w-full focus:ring-2 focus:ring-gray-300">
                    </div>
                    <div class="flex flex-col w-full md:w-[50%]">
                        <label class="pb-2 text-sm font-semibold" for="adresse">Adresse</label>
                        <input id="adresse" type="text" placeholder="Ex: Île du Saloum" required
                            class="outline-none border border-gray-400 p-[8px] rounded-xl w-full focus:ring-2 focus:ring-gray-300">
                    </div>
                </div>
                <div class="flex flex-col md:flex-row gap-4 justify-center w-full items-center p-2">
                    <div class="flex flex-col w-full md:w-[50%]">
                        <label class="pb-2 text-sm font-semibold" for="email">E-mail</label>
                        <input id="email" type="email" placeholder="exemple@gmail.com" required
                            class="outline-none border border-gray-400 p-[8px] rounded-xl w-full focus:ring-2 focus:ring-gray-300">
                    </div>
                    <div class="flex flex-col w-full md:w-[50%]">
                        <label class="pb-2 text-sm font-semibold" for="telephone">Téléphone</label>
                        <input id="telephone" type="text" placeholder="77 777 77 77" required
                            class="outline-none border border-gray-400 p-[8px] rounded-xl w-full focus:ring-2 focus:ring-gray-300">
                    </div>
                </div>
                <div class="flex flex-col md:flex-row gap-4 justify-center w-full items-center p-2">
                    <div class="flex flex-col w-full md:w-[50%]">
                        <label class="pb-2 text-sm font-semibold" for="prix">Prix par nuit</label>
                        <input id="prix" type="number" placeholder="25000" required
                            class="outline-none border border-gray-400 p-[8px] rounded-xl w-full focus:ring-2 focus:ring-gray-300">
                    </div>
                    <div class="flex flex-col w-full md:w-[50%]">
                        <label class="pb-2 text-sm font-semibold" for="devise">Devise</label>
                        <select id="devise" required
                            class="outline-none border border-gray-400 p-[9px] rounded-xl w-full bg-white cursor-pointer">
                            <option value="XOF">XOF (Franc CFA)</option>
                            <option value="Euro">Euro (€)</option>
                            <option value="Dollar">Dollar ($)</option>
                        </select>
                    </div>
                </div>
                <div class="p-2">
                    <label class="pb-2 text-sm font-semibold block">Photo de l'hôtel</label>
                    <label for="photo-input"
                        class="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed border-gray-400 rounded-xl cursor-pointer bg-gray-50 hover:bg-gray-100 transition-all">
                        <i class="fa-regular fa-image text-gray-700 text-3xl mb-2"></i>
                        <span class="text-gray-600 text-sm">Cliquez pour ajouter une photo</span>
                        <input id="photo-input" type="file" accept="image/*" class="hidden">
                    </label>
                </div>
                <div class="flex justify-center p-2">
                    <button type="submit"
                        class="text-white bg-[#555555] hover:bg-black transition-colors p-3 mt-2 rounded-xl text-sm font-bold w-full md:w-auto px-10 uppercase">
                        Enregistrer l'hôtel
                    </button>
                </div>
            </form>
        </div>
    </div>
    <!-- DETAILS -->

    <div id="detail-overlay" class="fixed inset-0 bg-black/50 hidden z-[9999]">
        <div class="w-[95%] md:w-[60%] lg:w-[40%] bg-white rounded-xl mx-auto mt-10 overflow-y-auto max-h-[90vh] p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 id="detail-nom" class="text-xl font-bold"></h2>
                <button onclick="fermerDetail()" class="text-gray-500 text-xl">✕</button>
            </div>
            <img id="detail-photo" class="w-full h-[200px] object-cover rounded-xl mb-4">
            <p class="text-sm text-pink-500 mb-2">📍 <span id="detail-adresse"></span></p>
            <p class="text-sm text-gray-600 mb-2">📧 <span id="detail-email"></span></p>
            <p class="text-sm text-gray-600 mb-2">📞 <span id="detail-telephone"></span></p>
            <p class="text-sm font-bold mt-4">💰 <span id="detail-prix"></span> <span id="detail-devise"></span> / nuit
            </p>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
</body>

</html>
